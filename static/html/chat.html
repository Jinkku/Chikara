    <div class="ct" id="chat-app" data-me="{usertag}">
        <aside class="ct-side" id="ct-side" aria-label="Conversations">
            <div class="ct-side-head">
                <h1>Chat</h1>
                <span class="ct-status" id="ct-status">Connecting…</span>
            </div>
            <div class="ct-scroll">
                <section class="ct-group" id="ct-invites-group" hidden>
                    <h2>Invites</h2>
                    <ul class="ct-invites" id="ct-invites"></ul>
                </section>
                <section class="ct-group">
                    <h2>Channels</h2>
                    <ul class="ct-list" id="ct-channels"></ul>
                </section>
                <section class="ct-group">
                    <div class="ct-group-head">
                        <h2>Rooms</h2>
                        <button type="button" class="ct-add" data-form="ct-new-room" aria-label="New room" title="New room">+</button>
                    </div>
                    <form class="ct-inline" id="ct-new-room" hidden>
                        <input type="text" maxlength="40" placeholder="Room name" aria-label="Room name" required>
                        <button type="submit">Create</button>
                    </form>
                    <ul class="ct-list" id="ct-rooms"></ul>
                    <p class="ct-hint" id="ct-rooms-empty">Make a private room and invite people.</p>
                </section>
                <section class="ct-group">
                    <div class="ct-group-head">
                        <h2>Direct messages</h2>
                        <button type="button" class="ct-add" data-form="ct-new-dm" aria-label="New message" title="New message">+</button>
                    </div>
                    <form class="ct-inline" id="ct-new-dm" hidden>
                        <input type="text" maxlength="256" placeholder="Username" aria-label="Username" required>
                        <button type="submit">Open</button>
                    </form>
                    <ul class="ct-list" id="ct-dms"></ul>
                    <p class="ct-hint" id="ct-dms-empty">No conversations yet.</p>
                </section>
                <section class="ct-group">
                    <h2>Online <span class="ct-count" id="ct-online-count"></span></h2>
                    <ul class="ct-online" id="ct-online"></ul>
                </section>
            </div>
        </aside>

        <section class="ct-main" aria-label="Messages">
            <header class="ct-main-head">
                <button type="button" class="ct-back" id="ct-back" aria-label="Show conversations">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"/></svg>
                </button>
                <div class="ct-title">
                    <h2 id="ct-title">&nbsp;</h2>
                    <p id="ct-subtitle"></p>
                </div>
                <div class="ct-actions" id="ct-actions">
                    <form class="ct-inline ct-invite" id="ct-invite" hidden>
                        <input type="text" maxlength="256" placeholder="Invite username" aria-label="Invite username" required>
                        <button type="submit">Invite</button>
                    </form>
                    <button type="button" class="ct-btn" id="ct-leave" hidden>Leave</button>
                </div>
            </header>
            <div class="ct-messages" id="ct-messages" role="log" aria-live="polite"></div>
            <p class="ct-error" id="ct-error" role="alert" hidden></p>
            <form class="ct-compose" id="ct-compose">
                <textarea id="ct-input" rows="1" maxlength="500" placeholder="Say something…" aria-label="Message" disabled></textarea>
                <button type="submit" class="ct-send" id="ct-send" disabled aria-label="Send">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7Z"/></svg>
                </button>
            </form>
        </section>
    </div>
