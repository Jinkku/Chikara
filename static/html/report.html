<div id="report-modal" class="report-modal" hidden>
    <form id="report-form" class="report-box">
        <h3>Report <span id="report-target"></span></h3>
        <p class="report-sub">The Qlute team will look at this. False reports may get <i>you</i> restricted. See the <a href="/rules">rules</a>.</p>
        <label for="report-category">What's wrong?</label>
        <select id="report-category" required>
            <option value="cheating">Cheating</option>
            <option value="profile">Inappropriate name or profile</option>
            <option value="chat">Chat abuse / harassment</option>
            <option value="multiplayer">Multiplayer abuse</option>
            <option value="spam">Spam</option>
            <option value="other">Other</option>
        </select>
        <label for="report-details">What happened?</label>
        <textarea id="report-details" rows="5" maxlength="2000" placeholder="Be specific: which map or score, what they said, when..." required></textarea>
        <label for="report-context">Link or score (optional)</label>
        <input id="report-context" type="text" maxlength="500" placeholder="e.g. a replay link or beatmap URL">
        <p id="report-status" class="report-status"></p>
        <div class="report-actions">
            <button type="button" class="login-btn" id="report-cancel">Cancel</button>
            <button type="submit" class="login-btn" id="report-send">Send report</button>
        </div>
    </form>
</div>
<style>
.report-modal { position: fixed; inset: 0; z-index: 1000; background: #000000a0; display: flex; align-items: center; justify-content: center; padding: 16px; }
.report-modal[hidden] { display: none; }
.report-box { background: #2a242f; border-radius: 8px; padding: 20px; width: 100%; max-width: 440px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 4px 16px #00000080; }
.report-box h3 { margin: 0 0 2px; }
.report-sub { margin: 0 0 8px; font-size: 13px; color: #ffffffaa; }
.report-box label { margin: 6px 0 0; font-size: 14px; }
.report-box select, .report-box textarea, .report-box input { width: 100%; box-sizing: border-box; padding: 8px; border: none; border-radius: 5px; background: #3a3342; color: #fff; font-family: inherit; font-size: 14px; }
.report-box textarea { resize: vertical; }
.report-status { min-height: 1em; margin: 4px 0; font-size: 14px; color: #f3baff; }
.report-actions { display: flex; gap: 8px; }
</style>
<script>
(function () {
    const modal = document.getElementById("report-modal");
    const form = document.getElementById("report-form");
    const status = document.getElementById("report-status");
    const send = document.getElementById("report-send");
    let target = "";
    function close() { modal.hidden = true; }
    document.querySelectorAll(".report-open").forEach(b => b.addEventListener("click", () => {
        target = b.dataset.target;
        document.getElementById("report-target").textContent = target;
        status.textContent = "";
        send.disabled = false;
        form.reset();
        modal.hidden = false;
        document.getElementById("report-details").focus();
    }));
    document.getElementById("report-cancel").addEventListener("click", close);
    modal.addEventListener("click", e => { if (e.target === modal) close(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape" && !modal.hidden) close(); });
    form.addEventListener("submit", async e => {
        e.preventDefault();
        send.disabled = true;
        status.textContent = "Sending...";
        try {
            const res = await fetch("/apiv2/mod/report", {
                method: "POST",
                headers: { "Content-Type": "application/json", "X-Chikara": "1" },
                body: JSON.stringify({
                    target,
                    category: document.getElementById("report-category").value,
                    details: document.getElementById("report-details").value,
                    context: document.getElementById("report-context").value,
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || "HTTP " + res.status);
            status.textContent = data.message || "Report sent.";
            setTimeout(close, 1500);
        } catch (err) {
            status.textContent = err.message;
            send.disabled = false;
        }
    });
})();
</script>
