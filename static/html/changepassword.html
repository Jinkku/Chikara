    <div class="infoboxcontainer">
        <div class="infoboxtitle">
            <h1 class="page-title">change password</h1>
        </div>
        <span class="infobox column verticalpadding">
            <div style="width: 100%; max-width: 420px; margin: 0 auto;">
            <p style="margin-bottom: 15px;">{intro}</p>
            <form id="changepasswordform">
                <div class="form-group" {currenthidden}>
                    <label for="cp-current">Current password:</label>
                    <input type="password" id="cp-current" autocomplete="current-password">
                </div>
                <div class="form-group">
                    <label for="cp-new">New password:</label>
                    <input type="password" id="cp-new" autocomplete="new-password" minlength="8" required>
                </div>
                <div class="form-group">
                    <label for="cp-confirm">Confirm new password:</label>
                    <input type="password" id="cp-confirm" autocomplete="new-password" minlength="8" required>
                </div>
                <p id="cp-status" style="margin-bottom: 10px; color: yellow;"></p>
                <button type="submit" class="login-btn">Save new password</button>
            </form>
            <p style="margin-top: 15px; opacity: 0.8;">After changing it, log in to the game again with your new password.</p>
            </div>
        </span>
    </div>
    <script src="/static/script/changepassword.js?v=1"></script>
