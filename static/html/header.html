<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{sitetitle}</title>
    <meta name="description" content="{description}">
    <meta name="robots" content="{robots}">
    <link rel="canonical" href="{canonical}">
    <meta name="theme-color" content="#2a2330">
    <meta property="og:site_name" content="Qlute">
    <meta property="og:type" content="{ogtype}">
    <meta property="og:title" content="{sitetitle}">
    <meta property="og:description" content="{description}">
    <meta property="og:url" content="{canonical}">
    <meta property="og:image" content="{ogimage}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{sitetitle}">
    <meta name="twitter:description" content="{description}">
    <meta name="twitter:image" content="{ogimage}">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="/static/css/styles.css?v=2">
    <link rel="stylesheet" href="/static/css/accountprompt.css?v=2">
    <link rel="stylesheet" href="/static/css/card.css?v=7">
    <link rel="stylesheet" href="/static/css/downloadbuttons.css">
    <script src="/static/script/login.js?v=3" defer></script>
    <script src="/static/script/checkoldsite.js" defer></script>
    {jsonld}
    {head}
    <link rel="stylesheet" href="/static/css/responsive.css?v=1">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header" id="header">
        <div class="header-left">
            <a href="/" class="header-logo" aria-label="Qlute home"><img src="/static/mainmenulogo.png" alt="Qlute" width="103" height="40"></a>
            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav" id="site-nav" aria-label="Main">
                <a class="nav-link" href="/">home</a>
                <a class="nav-link" href="/download">download</a>
                <a class="nav-link" href="/news">news</a>
                <a class="nav-link" href="/beatmaps">beatmaps</a>
                <a class="nav-link" href="/ranking">ranking</a>
                <a class="nav-link" href="/search">search</a>
                <a class="nav-link" href="/rules">rules</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="https://buymeacoffee.com/jinkkuproductions" class="header-support" aria-label="Support Qlute" rel="noopener">
                <img src="/static/img/Heart.png" alt="" width="32" height="32">
            </a>
            {headerbuttons}
            <a id="accountbutton" style="cursor: pointer;" role="button" tabindex="0" aria-label="Account">
                <div class="actualbutton">
                    <h3>{usertag}</h3>
                    <img class="pfp" src="{pfppath}" id="userpfp" alt="" width="40" height="40">
                </div>
            </a>
        </div>
    </header>

    <div id="menuprompt" class="accountprompt">
        <div id="loginForm" class="modal-content">
            <span id="loginprompt">
            <h3 style="margin-bottom: 15px;">Sign in to enter <3</h3>
            <p id="login_notice_text" style="margin-bottom: 10px;margin-top: 5px;color: yellow;"></p>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="login-btn">Login</button>
            </form>
            <h3 style="margin-top: 20px;">No Account?</h3>
            <p style="margin-bottom: 10px;margin-top: 10px;">if you wanna join, download our game first!</p>
            <a href="/download"><button class="login-btn">Download Qlute</button></a>
            </span>
            <span id="controlpanel">
                <p style="margin-bottom: 10px;">Welcome back, {usertag}!</p>
                <a href="/user/{usertag}"><button class="login-btn">My Profile</button></a>
                <a href="/friends"><button class="login-btn">Friends</button></a>
                <!--a href="/team/woogiesquad"><button class="login-btn">My Team</button></a -->
                <a href="/settings"><button class="login-btn">Settings</button></a>
                {adminbutton}
                <button id="logout" class="login-btn">Log out</button>
                <script src="/static/script/logout.js"></script>
            </span>
        </div>
    </div>

    <script>
    (function () {
        var header = document.getElementById("header");
        var toggle = document.getElementById("nav-toggle");
        toggle.addEventListener("click", function () {
            var open = header.classList.toggle("nav-open");
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && header.classList.contains("nav-open")) {
                header.classList.remove("nav-open");
                toggle.setAttribute("aria-expanded", "false");
                toggle.focus();
            }
        });
        var path = location.pathname.replace(/\/+$/, "") || "/";
        document.querySelectorAll("#site-nav .nav-link").forEach(function (a) {
            var href = a.getAttribute("href");
            if (href === path || (href !== "/" && path.indexOf(href + "/") === 0)
                || (href === "/beatmaps" && path.indexOf("/beatmapset/") === 0)) a.setAttribute("aria-current", "page");
        });
        window.addEventListener("scroll", function () {
            header.classList.toggle("scrolled", window.scrollY > 4);
        }, { passive: true });
    })();
    </script>
    <main id="main">
