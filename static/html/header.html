<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>{sitetitle}</title>
    <meta name="description" content="{description}">
    <meta name="robots" content="{robots}">
    <link rel="canonical" href="{canonical}">
    <meta name="theme-color" content="#2a2330">
    <meta property="og:site_name" content="Qlute">
    <meta property="og:type" content="{ogtype}">
    <meta property="og:title" content="{sitetitle}">
    <meta property="og:description" content="{description}">
    <meta property="og:url" content="{canonical}">
    <meta property="og:image" content="{ogimage}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{sitetitle}">
    <meta name="twitter:description" content="{description}">
    <meta name="twitter:image" content="{ogimage}">
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="apple-touch-icon" href="/static/img/favicon.png">
    <link rel="preload" href="/static/fonts/comfortaa-latin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/static/fonts/comfortaa.css?v=1">
    <link rel="stylesheet" href="/static/css/styles.css?v=5">
    <link rel="stylesheet" href="/static/css/accountprompt.css?v=5">
    <link rel="stylesheet" href="/static/css/card.css?v=9">
    <link rel="stylesheet" href="/static/css/downloadbuttons.css">
    <script src="/static/script/login.js?v=5" defer></script>
    <script src="/static/script/checkoldsite.js" defer></script>
    {jsonld}
    {head}
    <link rel="stylesheet" href="/static/css/responsive.css?v=1">
    <link rel="stylesheet" href="/static/css/header.css?v=3">
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="header" id="header">
        <div class="header-left">
            <a href="/" class="header-logo" aria-label="Qlute home"><img src="/static/mainmenulogo.png" alt="Qlute" width="103" height="40"></a>
            <button type="button" class="nav-toggle" id="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
                <span></span><span></span><span></span>
            </button>
            <nav class="site-nav" id="site-nav" aria-label="Main">
                <a class="nav-link" href="/">home</a>
                <a class="nav-link" href="/download">download</a>
                <a class="nav-link" href="/news">news</a>
                <a class="nav-link" href="/beatmaps">beatmaps</a>
                <a class="nav-link" href="/ranking">ranking</a>
                <a class="nav-link" href="/search">search</a>
                <a class="nav-link" href="/rules">rules</a>
            </nav>
        </div>
        <div class="header-right">
            <a href="/support" class="header-support" aria-label="Become a supporter" title="Become a supporter">
                <img src="/static/img/Heart.png" alt="" width="32" height="32">
            </a>
            {headerbuttons}
            <a id="accountbutton" style="cursor: pointer;" role="button" tabindex="0" aria-label="Account">
                <div class="actualbutton"{cardbanner}>
                    <h3>{usertag}</h3>
                    <img class="pfp" src="{pfppath}" id="userpfp" alt="" width="40" height="40">
                </div>
            </a>
        </div>
    </header>

    <div id="menuprompt" class="accountprompt">
        <div id="account-menu" class="modal-content am" role="dialog" aria-label="Account">
            <div id="loginprompt" class="am-login">
                <h3 class="am-title">Sign in to enter &lt;3</h3>
                <form id="loginForm" class="am-form">
                    <label class="am-field">
                        <span>Username</span>
                        <input type="text" id="username" name="username" autocomplete="username" required>
                    </label>
                    <label class="am-field">
                        <span>Password</span>
                        <input type="password" id="password" name="password" autocomplete="current-password" required>
                    </label>
                    <p id="login_notice_text" class="am-notice" role="status"></p>
                    <button type="submit" class="am-primary">Log in</button>
                </form>
                <div class="am-divider"></div>
                <p class="am-muted">No account? Download the game first, then sign up in it!</p>
                <a class="am-secondary" href="/download">Download Qlute</a>
            </div>
            <div id="controlpanel" class="am-panel">
                <a class="am-me" href="/user/{usertag}"{cardbanner}>
                    <img class="am-avatar" src="{pfppath}" alt="" width="48" height="48">
                    <span class="am-me-text">
                        <span class="am-hello">Welcome back,</span>
                        <strong>{usertag}</strong>
                    </span>
                </a>
                <nav class="am-items" aria-label="Account">
                    <a class="am-item" href="/user/{usertag}">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"/></svg>
                        My profile
                    </a>
                    <a class="am-item" href="/friends">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                        Friends
                    </a>
                    <a class="am-item" href="/chat">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20.5l1.4-4.9A8 8 0 1 1 21 12Z"/></svg>
                        Chat
                    </a>
                    <a class="am-item" href="/settings">
                        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
                        Settings
                    </a>
                    {adminbutton}
                </nav>
                <div class="am-divider"></div>
                <button type="button" id="logout" class="am-item am-logout">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Log out
                </button>
                <script src="/static/script/logout.js"></script>
            </div>
        </div>
    </div>

    <script>
    (function () {
        var header = document.getElementById("header");
        var toggle = document.getElementById("nav-toggle");
        toggle.addEventListener("click", function () {
            var open = header.classList.toggle("nav-open");
            toggle.setAttribute("aria-expanded", open ? "true" : "false");
        });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && header.classList.contains("nav-open")) {
                header.classList.remove("nav-open");
                toggle.setAttribute("aria-expanded", "false");
                toggle.focus();
            }
        });
        var path = location.pathname.replace(/\/+$/, "") || "/";
        document.querySelectorAll("#site-nav .nav-link").forEach(function (a) {
            var href = a.getAttribute("href");
            if (href === path || (href !== "/" && path.indexOf(href + "/") === 0)
                || (href === "/beatmaps" && path.indexOf("/beatmapset/") === 0)) a.setAttribute("aria-current", "page");
        });
        window.addEventListener("scroll", function () {
            header.classList.toggle("scrolled", window.scrollY > 4);
        }, { passive: true });
    })();
    </script>
    <main id="main">
